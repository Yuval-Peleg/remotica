<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RemotePrint</title>
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <!-- Navbar Section-->
    <header class="navbar">
        <nav class="navbar__container">
            <a href="/" id="navbar__logo">REMOTIKA</a>
            <div class="navbar__toggle" id="mobile-menu">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </div>
            <ul class="navbar__menu">
                <li class="navbar__item">
                    <a href="./System.html" class="navbar__links">System</a>
                </li>
                <li class="navbar__item">
                    <a href="./Settings.html" class="navbar__links">Settings</a>
                </li>
                <li class="navbar__item">
                    <a href="./About.html" class="navbar__links">About</a>
                </li>
                <li class="navbar__btn">
                    <a href="/" class="button">Print</a>
                </li>
            </ul>
        </nav>
    </header>

    <!-- Main Section -->
    <main class="main">
        <!-- left column -->
        <section class="main__column">
            <h1 class="blob" id="connection__status">Connected</h1>

            <div class="blob">
                <img id="preview__image" src="/images/placeholder1.jpeg" alt="">

                <div id="print__data">
                    State: <br>
                    <hr class="rounded__divider">
                    File: <br>
                    Print Time: <br>
                    Print Time Left: <br>
                </div>

                <div class="progress__bar">
                    <div id="print__progress">0%</div>
                </div>
            </div>
            
        </section>

        <!-- tabs block -->
        <section class="main__tabs">
            <!-- tabs -->
             <div class="tabs">
                <input type="radio" id="tab1" name="tabs" checked/>
                <label for="tab1">
                    <div class="tab__label">Control</div>
                    <!-- <hr class="rounded__divider"> -->
                </label>

                <input type="radio" id="tab2" name="tabs"/>
                <label for="tab2">
                    <div class="tab__label">Temprature</div>
                    
                </label>
             </div>
            
             <!-- divider between tabs and the content -->
            <hr class="rounded__divider">

            <!-- tab content -->
            <div class="tab__content blob"  id="control-content">
                <img id="webcam-stream" src="images/placeholder2.jpg" alt="">
            </div>

            <div class="tab__content blob" id="temp-content">
                temprature blah blah blah blah
            </div>

        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
